<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GU Student Portal | Login</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <section class="card login-card shadow-lg">
      <header class="card-header text-center text-white py-4">
        <h1 class="h2 mb-0 fw-bold">Gensan University</h1>
        <p class="mb-0 small">Student Portal</p>
      </header>

      <div class="card-body p-4">
        <div id="alertContainer" aria-live="polite"></div>

        <form id="login-form">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="Enter username"
              autocomplete="username"
              required
            >
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit" id="loginBtn" class="btn btn-primary w-100">
            Log In
          </button>
        </form>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
